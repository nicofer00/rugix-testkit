name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint, Type Check, and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - name: Check
        run: mise run check
